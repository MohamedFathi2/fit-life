<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fit Life Tracker</title>
<meta name="theme-color" content="#0f172a">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1 id="title">Fit Life</h1>
  <div class="top-actions">
    <button id="langBtn" class="chip" data-action="toggle-lang">عربي</button>
    <button class="icon-btn" data-action="go" data-tab="settings" aria-label="Settings">⚙️</button>
  </div>
</header>

<main id="view"></main>

<div id="timer" class="timer hidden">
  <span id="timerLabel"></span>
  <strong id="timerTime">0:00</strong>
  <button class="chip" data-action="timer-add">+30s</button>
  <button class="chip" data-action="timer-stop">✕</button>
</div>

<nav class="tabbar" id="tabbar"></nav>

<div id="toast" class="toast hidden"></div>

<script src="data/plan-data.js"></script>
<script src="app.js"></script>
</body>
</html>
